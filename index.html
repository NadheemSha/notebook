<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Memories</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&display=swap" rel="stylesheet">

<style>
/* =========================================================
   DESIGN SYSTEM
   ========================================================= */

:root{
  --cream:#fffaf2;
  --pink:#ffb7c9;
  --baby-pink:#ffdce7;
  --lavender:#dcd0ff;
  --mint:#c9f4df;
  --baby-blue:#ccecff;
  --butter:#fff1ad;
  --peach:#ffd0b5;
  --brown:#70504a;

  --paper-line:rgba(255,145,175,.28);
  --paper-shadow:rgba(89,58,51,.18);

  --ease:cubic-bezier(.22,1,.36,1);
}

*,
*::before,
*::after{
  box-sizing:border-box;
}

html{
  min-height:100%;
  background:var(--cream);
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  min-height:100svh;

  color:var(--brown);
  font-family:"Hachi Maru Pop",cursive,sans-serif;

  overflow-x:hidden;

  background-color:var(--cream);

  /* notebook paper */
  background-image:
    repeating-linear-gradient(
      to bottom,
      transparent 0 27px,
      var(--paper-line) 27px 28px
    );
}


/* =========================================================
   NOTEBOOK SPINE
   ========================================================= */

.notebook-spine{
  position:fixed;
  inset:0 auto 0 0;

  width:42px;

  z-index:40;

  pointer-events:none;

  background:
    radial-gradient(
      circle at 20px 20px,
      #fff 0 6px,
      var(--lavender) 6px 9px,
      transparent 9px
    );

  background-size:40px 42px;
  background-repeat:repeat-y;
}

.notebook-spine::after{
  content:"";

  position:absolute;
  top:0;
  right:2px;
  bottom:0;

  width:2px;

  background:var(--pink);
  opacity:.55;
}


/* =========================================================
   DAYLIGHT BACKGROUND
   ========================================================= */

.background{
  position:fixed;
  inset:0;

  z-index:0;

  overflow:hidden;

  pointer-events:none;

  background:
    radial-gradient(
      circle at 17% 13%,
      rgba(255,255,255,.78),
      transparent 21%
    ),
    radial-gradient(
      circle at 82% 25%,
      rgba(255,241,173,.22),
      transparent 18%
    ),
    linear-gradient(
      180deg,
      #ccecff 0%,
      #fff7ed 52%,
      #dff7e8 100%
    );
}


/* =========================================================
   MOVING CLOUDS
   ========================================================= */

.cloud{
  position:absolute;

  width:120px;
  height:36px;

  border-radius:999px;

  background:rgba(255,255,255,.72);

  opacity:.8;

  animation:cloudMove linear infinite;
}

.cloud::before,
.cloud::after{
  content:"";

  position:absolute;
  bottom:8px;

  border-radius:50%;

  background:inherit;
}

.cloud::before{
  left:21px;
  width:42px;
  height:42px;
}

.cloud::after{
  left:57px;
  width:31px;
  height:31px;
}

.cloud-1{
  top:10%;
  left:-160px;
  animation-duration:36s;
}

.cloud-2{
  top:29%;
  left:-220px;
  transform:scale(.72);
  animation-duration:48s;
  animation-delay:-19s;
}

.cloud-3{
  top:5%;
  left:-280px;
  transform:scale(.5);
  animation-duration:55s;
  animation-delay:-31s;
}

@keyframes cloudMove{
  from{
    margin-left:0;
  }

  to{
    margin-left:calc(100vw + 480px);
  }
}


/* =========================================================
   FLOATING SCRAPBOOK DECOR
   ========================================================= */

.decor-layer{
  position:fixed;
  inset:0;

  z-index:-1;

  overflow:hidden;

  pointer-events:none;
}

.decor{
  position:absolute;

  user-select:none;

  opacity:.76;

  animation:
    decorFloat var(--duration)
    ease-in-out infinite;

  animation-delay:var(--delay);
}

@keyframes decorFloat{
  0%,100%{
    transform:
      translate3d(0,0,0)
      rotate(var(--rotation));
  }

  50%{
    transform:
      translate3d(var(--float-x),-18px,0)
      rotate(calc(var(--rotation) + 5deg));
  }
}

.flower{color:#ff9fbb}
.heart{color:#ff8fae}
.star{color:#ffd35f}
.leaf{color:#83c99f}
.diamond{color:#73d7e8}
.bow{color:#eaa8d0}


/* =========================================================
   SAKURA PETALS
   ========================================================= */

.sakura-layer{
  position:fixed;
  inset:0;

  z-index:0;

  pointer-events:none;

  overflow:hidden;
}

.petal{
  position:absolute;

  top:-30px;

  width:10px;
  height:7px;

  border-radius:80% 20% 80% 20%;

  background:#ffb7c9;

  opacity:.62;

  transform:rotate(35deg);

  animation:
    petalFall var(--fall-duration) linear infinite;

  animation-delay:var(--fall-delay);
}

@keyframes petalFall{
  0%{
    transform:
      translate3d(0,-30px,0)
      rotate(0deg);
  }

  25%{
    transform:
      translate3d(var(--sway),25vh,0)
      rotate(90deg);
  }

  50%{
    transform:
      translate3d(calc(var(--sway) * -1),50vh,0)
      rotate(180deg);
  }

  75%{
    transform:
      translate3d(var(--sway),75vh,0)
      rotate(270deg);
  }

  100%{
    transform:
      translate3d(0,110vh,0)
      rotate(360deg);
  }
}


/* =========================================================
   MAIN
   ========================================================= */

.app{
  position:relative;
  z-index:2;

  min-height:100vh;
  min-height:100svh;

  padding:
    28px
    22px
    40px
    62px;

  isolation:isolate;
}


/* =========================================================
   DECORATIVE TOP AREA
   No heading/title.
   ========================================================= */

.top-doodles{
  width:min(100%,1000px);

  height:42px;

  margin:0 auto 5px;

  position:relative;

  pointer-events:none;
}

.top-doodles span{
  position:absolute;

  font-size:1.05rem;

  opacity:.72;
}

.top-doodles .a{
  left:5%;
  transform:rotate(-12deg);
}

.top-doodles .b{
  left:19%;
  top:11px;
  transform:rotate(7deg);
}

.top-doodles .c{
  right:20%;
  top:3px;
  transform:rotate(-8deg);
}

.top-doodles .d{
  right:5%;
  top:12px;
  transform:rotate(11deg);
}


/* =========================================================
   BOOK
   ========================================================= */

.book{
  position:relative;

  width:min(100%,1000px);

  margin:0 auto;

  padding:20px;

  border-radius:28px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.90),
      rgba(255,247,237,.95)
    );

  border:
    2px solid
    rgba(255,255,255,.88);

  box-shadow:
    0 22px 45px rgba(79,53,48,.17),
    0 4px 10px rgba(79,53,48,.08);

  /*
    Very light paper grain.
    It is intentionally subtle so it doesn't
    compete with Minecraft screenshots.
  */
  background-image:
    radial-gradient(
      rgba(112,80,74,.045) .65px,
      transparent .65px
    ),
    linear-gradient(
      135deg,
      rgba(255,255,255,.90),
      rgba(255,247,237,.95)
    );

  background-size:6px 6px,100% 100%;
}

.book::before{
  content:"";

  position:absolute;

  inset:8px;

  border:
    2px dashed
    rgba(255,183,201,.42);

  border-radius:22px;

  pointer-events:none;
}

.book::after{
  content:"";

  position:absolute;

  right:20px;
  bottom:14px;

  width:58px;
  height:18px;

  border-bottom:
    2px solid
    rgba(112,80,74,.20);

  border-radius:50%;

  transform:rotate(-5deg);

  pointer-events:none;
}


/* =========================================================
   PHOTOS
   ========================================================= */

.viewport{
  position:relative;

  width:100%;

  overflow:hidden;

  border-radius:20px;
}

.track{
  display:flex;

  transition:
    transform .62s var(--ease);

  will-change:transform;
}

.page{
  flex:0 0 100%;

  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  align-items:center;

  justify-content:center;

  gap:20px;

  min-width:100%;

  padding:
    25px
    18px
    30px;
}


/* =========================================================
   POLAROIDS
   ========================================================= */

.polaroid{
  --rotation:0deg;

  position:relative;

  width:min(100%,250px);

  justify-self:center;

  padding:
    11px
    11px
    15px;

  background:#fff;

  box-shadow:
    0 13px 23px rgba(80,52,47,.19),
    0 2px 5px rgba(80,52,47,.08);

  transform:
    rotate(var(--rotation));

  cursor:pointer;

  transition:
    transform .25s var(--ease),
    box-shadow .25s ease;
}

.polaroid:hover{
  transform:
    rotate(0deg)
    translateY(-7px)
    scale(1.025);

  box-shadow:
    0 20px 30px rgba(80,52,47,.22);
}

.polaroid:focus-visible{
  outline:
    3px dashed
    var(--pink);

  outline-offset:5px;
}

.polaroid.clicked{
  animation:
    photoPop .28s var(--ease);
}

@keyframes photoPop{
  0%{
    transform:
      rotate(var(--rotation))
      scale(1);
  }

  50%{
    transform:
      rotate(0deg)
      scale(1.04);
  }

  100%{
    transform:
      rotate(var(--rotation))
      scale(1);
  }
}


/* =========================================================
   PHOTO FRAME
   ========================================================= */

.photo-frame{
  position:relative;

  width:100%;

  aspect-ratio:4/3;

  overflow:hidden;

  background:
    linear-gradient(
      135deg,
      var(--mint),
      var(--lavender)
    );
}

.photo-frame img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;

  transition:
    transform .5s var(--ease);
}

.polaroid:hover .photo-frame img{
  transform:scale(1.025);
}


/* =========================================================
   MISSING PHOTO
   ========================================================= */

.image-placeholder{
  position:absolute;
  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  flex-direction:column;

  gap:5px;

  background:
    linear-gradient(
      135deg,
      var(--baby-pink),
      var(--lavender)
    );

  text-align:center;
}

.image-placeholder strong{
  font-size:.82rem;
}

.image-placeholder small{
  font-size:.62rem;
  opacity:.65;
  max-width:90%;
}


/* =========================================================
   WASHI TAPE
   ========================================================= */

.washi{
  position:absolute;

  top:-9px;

  width:62px;
  height:20px;

  z-index:4;

  opacity:.9;

  box-shadow:
    0 2px 4px rgba(70,40,35,.11);

  background-size:12px 12px;

  transition:
    transform .25s var(--ease);
}

.polaroid:hover .washi.left{
  transform:
    rotate(-9deg)
    translateY(-2px);
}

.polaroid:hover .washi.right{
  transform:
    rotate(9deg)
    translateY(-2px);
}

.washi.left{
  left:8px;
  transform:rotate(-12deg);
}

.washi.right{
  right:8px;
  transform:rotate(12deg);
}


/* =========================================================
   STICKERS
   ========================================================= */

.sticker{
  position:absolute;

  right:-9px;
  bottom:-8px;

  z-index:5;

  display:grid;
  place-items:center;

  width:38px;
  height:38px;

  border-radius:50%;

  background:#fff;

  font-size:1.25rem;

  box-shadow:
    0 4px 9px rgba(70,40,35,.15);

  transform:rotate(7deg);

  animation:
    stickerFloat
    3.5s
    ease-in-out
    infinite;
}

@keyframes stickerFloat{
  0%,100%{
    transform:
      rotate(7deg)
      translateY(0);
  }

  50%{
    transform:
      rotate(10deg)
      translateY(-3px);
  }
}


/* =========================================================
   HAND-DRAWN ARROWS / FLOWERS / HEARTS
   ========================================================= */

.doodle{
  position:absolute;

  pointer-events:none;

  font-size:1rem;

  opacity:.72;
}

.doodle.one{
  top:25px;
  left:28px;
  transform:rotate(-12deg);
}

.doodle.two{
  right:32px;
  top:42px;
  transform:rotate(10deg);
}

.doodle.three{
  left:45%;
  bottom:13px;
  transform:rotate(-8deg);
}


/* =========================================================
   NAVIGATION
   ========================================================= */

.navigation{
  display:flex;

  align-items:center;
  justify-content:center;

  gap:14px;

  margin-top:3px;
}

.nav-btn{
  width:45px;
  height:45px;

  border:0;
  border-radius:14px;

  background:#fff;

  color:var(--brown);

  font:inherit;
  font-size:1.4rem;

  cursor:pointer;

  box-shadow:
    0 5px 10px rgba(80,50,45,.13);

  transition:
    transform .18s var(--ease),
    box-shadow .18s ease,
    opacity .18s ease;
}

.nav-btn:hover:not(:disabled){
  transform:
    translateY(-3px)
    rotate(-2deg);

  box-shadow:
    0 8px 15px rgba(80,50,45,.16);
}

.nav-btn:active:not(:disabled){
  transform:scale(.93);
}

.nav-btn:disabled{
  opacity:.3;
  cursor:default;
}

.nav-btn:focus-visible{
  outline:
    3px dashed
    var(--pink);

  outline-offset:3px;
}

.page-info{
  min-width:110px;

  text-align:center;

  font-size:.78rem;

  opacity:.78;
}

.page-number{
  display:block;

  font-size:.95rem;

  color:#d8839e;
}


/* =========================================================
   XP BAR
   ========================================================= */

.xp-panel{
  width:min(100%,500px);

  margin:18px auto 0;

  padding:10px 13px;

  border-radius:15px;

  background:
    linear-gradient(
      180deg,
      #5a514f,
      #403b3a
    );

  color:#fff;

  box-shadow:
    0 7px 15px rgba(50,35,31,.18);

  border:
    2px solid
    rgba(255,255,255,.32);
}

.xp-top{
  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:10px;

  margin-bottom:7px;

  font-size:.67rem;
}

.xp-title{
  color:#ffd9e5;
}

.xp-value{
  color:#fff1ad;
}

.xp-bar{
  height:13px;

  padding:2px;

  border:
    2px solid
    #262321;

  background:#252322;

  overflow:hidden;
}

.xp-fill{
  height:100%;

  /*
    This width is controlled by JavaScript.
    It follows the CURRENT PAGE, so going forward
    increases the line and going backward decreases it.
  */
  width:0%;

  background:
    repeating-linear-gradient(
      90deg,
      #79e26d 0 13px,
      #69d65f 13px 17px
    );

  transition:
    width .55s var(--ease);
}

.xp-bottom{
  display:flex;

  justify-content:space-between;

  margin-top:6px;

  font-size:.65rem;

  opacity:.85;
}


/* =========================================================
   FULLSCREEN PHOTO VIEWER
   ========================================================= */

.viewer{
  position:fixed;
  inset:0;

  z-index:100;

  display:grid;
  place-items:center;

  padding:20px;

  background:
    rgba(35,27,40,.56);

  backdrop-filter:
    blur(12px);

  opacity:0;
  visibility:hidden;

  transition:
    opacity .25s ease,
    visibility .25s ease;
}

.viewer.open{
  opacity:1;
  visibility:visible;
}

.viewer-card{
  position:relative;

  width:min(94vw,850px);

  max-height:90vh;

  padding:13px;

  background:#fff;

  box-shadow:
    0 25px 60px rgba(0,0,0,.28);

  transform:
    translateY(18px)
    scale(.94)
    rotate(-1deg);

  transition:
    transform .35s var(--ease);
}

.viewer.open .viewer-card{
  transform:
    translateY(0)
    scale(1)
    rotate(0deg);
}

.viewer-image-wrap{
  position:relative;

  width:100%;

  max-height:
    calc(90vh - 70px);

  overflow:hidden;

  background:#f5efe9;
}

.viewer-image{
  display:block;

  width:100%;

  max-height:
    calc(90vh - 70px);

  object-fit:contain;
}

.viewer-date{
  padding:
    8px
    4px
    2px;

  text-align:center;

  font-size:.75rem;

  opacity:.7;
}

.viewer-close{
  position:absolute;

  top:-15px;
  right:-15px;

  width:38px;
  height:38px;

  border:0;
  border-radius:50%;

  background:#fff;

  color:var(--brown);

  font:inherit;
  font-size:1.1rem;

  cursor:pointer;

  box-shadow:
    0 5px 13px rgba(0,0,0,.2);

  z-index:4;

  transition:
    transform .18s var(--ease);
}

.viewer-close:hover{
  transform:
    rotate(8deg)
    scale(1.05);
}

.viewer-close:focus-visible{
  outline:
    3px dashed
    var(--pink);
}


/* =========================================================
   PIXEL SPARKLES
   Based on the original Minecraft-style sparkle idea:
   pixel hearts + diamonds.
   ========================================================= */

.sparkle-layer{
  position:fixed;
  inset:0;

  z-index:200;

  pointer-events:none;

  overflow:hidden;
}

.pixel-burst{
  position:fixed;

  left:0;
  top:0;

  width:max-content;
  height:max-content;

  pointer-events:none;

  animation:
    pixelBurst .85s ease-out forwards;
}

.pixel-burst svg{
  display:block;
}

@keyframes pixelBurst{
  from{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1)
      rotate(0deg);
  }

  to{
    opacity:0;

    transform:
      translate(
        calc(-50% + var(--dx)),
        calc(-50% + var(--dy))
      )
      scale(.4)
      rotate(var(--rotate));
  }
}


/* =========================================================
   FLOATING PIXEL SPARKLES
   These remain around the page instead of only appearing
   after a click.
   ========================================================= */

.floating-pixel-layer{
  position:fixed;
  inset:0;

  z-index:1;

  pointer-events:none;

  overflow:hidden;
}

.floating-pixel{
  position:absolute;

  width:var(--pixel-size);
  height:var(--pixel-size);

  opacity:0;

  animation:
    floatingPixel
    var(--duration)
    ease-in-out
    infinite;

  animation-delay:var(--delay);
}

.floating-pixel::before{
  content:"";

  position:absolute;
  inset:0;

  background:var(--pixel-color);

  box-shadow:
    var(--pixel-size) 0 0 var(--pixel-color),
    0 var(--pixel-size) 0 var(--pixel-color),
    var(--pixel-size) var(--pixel-size) 0 var(--pixel-color);
}

@keyframes floatingPixel{
  0%{
    opacity:0;

    transform:
      translate3d(0,30px,0)
      scale(.7);
  }

  20%{
    opacity:.65;
  }

  50%{
    opacity:.9;

    transform:
      translate3d(var(--float-x),-20px,0)
      scale(1);
  }

  80%{
    opacity:.45;
  }

  100%{
    opacity:0;

    transform:
      translate3d(
        calc(var(--float-x) * -1),
        -65px,
        0
      )
      scale(.5);
  }
}


/* =========================================================
   XP PARTICLES
   ========================================================= */

.xp-particle{
  position:fixed;

  z-index:210;

  pointer-events:none;

  color:#fff1ad;

  font-size:.75rem;

  font-weight:bold;

  animation:
    xpRise .9s var(--ease) forwards;
}

@keyframes xpRise{
  from{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(.8);
  }

  to{
    opacity:0;

    transform:
      translate(
        calc(-50% + var(--dx)),
        calc(-50% + var(--dy))
      )
      scale(1);
  }
}


/* =========================================================
   SAVED NOTIFICATION
   ========================================================= */

.toast{
  position:fixed;

  right:18px;
  bottom:18px;

  z-index:150;

  display:flex;

  align-items:center;

  gap:9px;

  max-width:
    min(330px,calc(100vw - 36px));

  padding:
    11px
    14px;

  border-radius:14px;

  background:
    rgba(255,255,255,.95);

  box-shadow:
    0 12px 25px rgba(60,40,38,.18);

  border:
    2px solid
    var(--mint);

  transform:
    translateY(20px)
    scale(.95);

  opacity:0;

  pointer-events:none;

  transition:
    transform .35s var(--ease),
    opacity .35s ease;
}

.toast.show{
  transform:
    translateY(0)
    scale(1);

  opacity:1;
}

.toast-icon{
  width:25px;
  height:25px;

  display:grid;
  place-items:center;

  border-radius:50%;

  background:var(--mint);
}

.toast-text{
  font-size:.68rem;
  line-height:1.35;
}


/* =========================================================
   ALBUM / VIDEO TAPE HOME
   ========================================================= */
.home-screen{width:min(100%,700px);margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;padding:35px 24px 38px}
.home-choice{position:relative;min-height:210px;border:0;padding:24px;background:#fff;color:var(--brown);font:inherit;cursor:pointer;box-shadow:0 13px 23px rgba(80,52,47,.19),0 2px 5px rgba(80,52,47,.08);transform:rotate(var(--choice-rotation));transition:transform .25s var(--ease),box-shadow .25s ease;display:grid;place-items:center;text-align:center}
.home-choice:hover{transform:rotate(0deg) translateY(-7px) scale(1.025);box-shadow:0 20px 30px rgba(80,52,47,.22)}
.home-choice::before{content:"";position:absolute;inset:11px;border:2px dashed rgba(255,183,201,.42);pointer-events:none}
.home-choice-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;line-height:1.15}
.home-choice-icon{display:block;font-size:3rem;line-height:1;height:52px;margin:0;position:relative}
.home-choice-title{display:block;font-size:1.25rem;letter-spacing:.04em;line-height:1.2}
.home-choice-subtitle{display:block;margin:0;font-size:.68rem;line-height:1.35;opacity:.62}
.album-content,.video-screen{display:none}.album-content.active,.video-screen.active{display:block}
.video-viewport{position:relative;width:100%;overflow:hidden;border-radius:20px}
.video-track{display:flex;transition:transform .62s var(--ease);will-change:transform}
.video-page{flex:0 0 100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding:25px 18px 30px;min-width:100%;align-items:center}
.video-card{position:relative;background:#fff;padding:11px 11px 15px;box-shadow:0 13px 23px rgba(80,52,47,.19),0 2px 5px rgba(80,52,47,.08);transform:rotate(var(--video-rotation));cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s ease}
.video-card:hover{transform:rotate(0deg) translateY(-7px) scale(1.025);box-shadow:0 20px 30px rgba(80,52,47,.22)}
.video-frame{width:100%;aspect-ratio:4/3;overflow:hidden;background:linear-gradient(135deg,var(--mint),var(--lavender))}.video-frame video{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none}.video-label{padding:9px 4px 0;text-align:center;font-size:.72rem;opacity:.75}
.video-navigation{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:3px}
.video-page-info{min-width:110px;text-align:center;font-size:.78rem;opacity:.78}.video-page-number{display:block;font-size:.95rem;color:#d8839e}
.video-back,.home-back{display:block;margin:14px auto 3px;border:0;border-radius:14px;background:#fff;color:var(--brown);font:inherit;padding:9px 16px;cursor:pointer;box-shadow:0 5px 10px rgba(80,50,45,.13)}.video-back:hover,.home-back:hover{transform:translateY(-2px)}
.viewer-video{display:none;width:100%;max-height:calc(90vh - 70px);object-fit:contain;background:#000}
@media(max-width:760px){.video-page{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}}
@media(max-width:500px){.home-screen{width:100%;grid-template-columns:1fr;gap:24px;padding:28px 8px 30px}.home-choice{min-height:200px}.video-page{grid-template-columns:1fr;gap:24px;padding:24px 8px 25px}}

  }

<script>
"use strict";


/* =========================================================
   PHOTO DATA
   =========================================================

   Add/remove objects here.

   Example:

   {
     src:"images/shot5.jpg",
     alt:"Minecraft memory 5",
     date:"Memory 05"
   }

   Pages are generated automatically.
   ========================================================= */

const IMAGE_COUNT = 15; // ← ONLY CHANGE THIS NUMBER
const VIDEO_COUNT = 10; // ← change this for the number of clips
const IMAGE_FOLDER = "images";
const IMAGE_PREFIX = "shot";
const IMAGE_EXTENSION = ".jpg";

const PHOTOS = Array.from(
  { length: IMAGE_COUNT },
  (_, index) => {
    const number = index + 1;
    return {
      src: `${IMAGE_FOLDER}/${IMAGE_PREFIX}${number}${IMAGE_EXTENSION}`,
      alt: `Minecraft memory ${number}`,
      date: `Memory ${String(number).padStart(2, "0")}`
    };
  }
);

function getPageSize(){

  /* Desktop: 6 photos per page.
     Mobile: keep the original 3 photos per page. */
  return window.innerWidth <= 760 ? 3 : 6;

}


/* =========================================================
   DECORATION CONFIGURATION
   ========================================================= */

const WASHI = [

  ["var(--baby-pink)","var(--butter)"],

  ["var(--mint)","var(--lavender)"],

  ["var(--baby-blue)","var(--baby-pink)"],

  ["var(--lavender)","var(--pink)"],

  ["var(--butter)","var(--mint)"]

];


const STICKERS = [

  "💎",
  "🌸",
  "⭐",
  "🎀",
  "🐝",
  "🍓",
  "🦋",
  "♡"

];


const DECORATIONS = [

  {
    char:"✦",
    className:"star",
    x:7,
    y:17,
    rotation:-10,
    duration:5
  },

  {
    char:"♡",
    className:"heart",
    x:91,
    y:25,
    rotation:8,
    duration:6
  },

  {
    char:"🌸",
    className:"flower",
    x:12,
    y:62,
    rotation:-5,
    duration:8
  },

  {
    char:"🍃",
    className:"leaf",
    x:94,
    y:70,
    rotation:10,
    duration:7
  },

  {
    char:"✧",
    className:"star",
    x:82,
    y:11,
    rotation:4,
    duration:5
  },

  {
    char:"💎",
    className:"diamond",
    x:5,
    y:84,
    rotation:-8,
    duration:9
  },

  {
    char:"🎀",
    className:"bow",
    x:86,
    y:88,
    rotation:7,
    duration:8
  },

  {
    char:"🌸",
    className:"flower",
    x:45,
    y:8,
    rotation:-4,
    duration:7
  },

  {
    char:"♡",
    className:"heart",
    x:53,
    y:92,
    rotation:6,
    duration:6
  }

];


/* =========================================================

   ========================================================= */

const track =

const viewport =

const prevBtn =
  document.getElementById("prevBtn");

const nextBtn =
  document.getElementById("nextBtn");

const pageNumber =

const pageTotal =
  document.getElementById("pageTotal");

const xpFill =

const xpValue =
  document.getElementById("xpValue");

const xpProgressText =
  document.getElementById("xpProgressText");

const xpBar =
  document.querySelector(".xp-bar");

const decorLayer =
  document.getElementById("decorLayer");

const sakuraLayer =
  document.getElementById("sakuraLayer");

const floatingPixelLayer =

const homeScreen = document.getElementById("homeScreen");
const albumChoice = document.getElementById("albumChoice");

const videoTrack = document.getElementById("videoTrack");

const videoNextBtn = document.getElementById("videoNextBtn");
const videoPageNumber = document.getElementById("videoPageNumber");
const videoPageTotal = document.getElementById("videoPageTotal");
const videoBack = document.getElementById("videoBack");
const viewerVideo = document.getElementById("viewerVideo");


/* =========================================================
   STATE
   ========================================================= */

let currentPage = 0;
let currentVideoPage = 0;

let toastTimer = null;

let touchStartX = null;

const reduceMotion =
  window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;


/* =========================================================
   HELPERS
   ========================================================= */

function randomItem(array){

  return array[
    Math.floor(
      Math.random() * array.length
    )
  ];

}


function clamp(value,min,max){

  return Math.max(
    min,
    Math.min(max,value)
  );

}


/* =========================================================
   DECORATIONS
   ========================================================= */

function createBackgroundDecorations(){

  DECORATIONS.forEach(item=>{

    const element =
      document.createElement("span");

    element.className =
      `decor ${item.className}`;

    element.textContent =
      item.char;

    element.style.left =
      `${item.x}%`;

    element.style.top =
      `${item.y}%`;

    element.style.setProperty(
      "--rotation",
      `${item.rotation}deg`
    );

    element.style.setProperty(
      "--duration",
      `${item.duration}s`
    );

    element.style.setProperty(
      "--delay",
      `${Math.random()*-5}s`
    );

    element.style.setProperty(
      "--float-x",

    );

}


/* =========================================================
   SAKURA GENERATOR
   ========================================================= */

function createSakura(){

  /*
    Keep the number moderate.
    The petals are decoration, not the main subject.
  */

  const count =
    reduceMotion ? 6 : 18;

  for(let i=0;i<count;i++){

    const petal =
      document.createElement("span");

    petal.className =
      "petal";

    petal.style.left =
      `${Math.random()*100}%`;

    petal.style.setProperty(
      "--fall-duration",
      `${10 + Math.random()*13}s`
    );

    petal.style.setProperty(
      "--fall-delay",
      `${Math.random()*-20}s`
    );

    petal.style.setProperty(
      "--sway",
      `${30 + Math.random()*80}px`
    );

    petal.style.transform =
      `scale(${.65 + Math.random()*.65})`;

    sakuraLayer.appendChild(
      petal
    );

  }

}


/* =========================================================
   FLOATING PIXEL SPARKLES
   =========================================================

   These are separate from the click burst.

   They continuously float upward around the page,
   using the same pixel-like visual language as the
   original heart/diamond sparkle code.
   ========================================================= */

function createFloatingPixels(){

  const count =
    reduceMotion ? 8 : 28;

  const colors = [

    "#eb4b4b",
    "#54d6c4",
    "#ffd966",
    "#ff9eb5",
    "#8fd3fe"

  ];

  for(let i=0;i<count;i++){

    const pixel =
      document.createElement("span");

    pixel.className =
      "floating-pixel";

    pixel.style.left =
      `${Math.random()*100}%`;

    pixel.style.top =
      `${20 + Math.random()*80}%`;

    pixel.style.setProperty(
      "--pixel-size",
      `${1.5 + Math.random()*2.2}px`
    );

    pixel.style.setProperty(
      "--pixel-color",
      randomItem(colors)
    );

    pixel.style.setProperty(
      "--duration",
      `${5 + Math.random()*7}s`
    );

    pixel.style.setProperty(
      "--delay",
      `${Math.random()*-12}s`
    );

    pixel.style.setProperty(
      "--float-x",
      `${(Math.random()-.5)*70}px`
    );

    floatingPixelLayer.appendChild(
      pixel
    );

  }

}


/* =========================================================
   ORIGINAL-STYLE PIXEL SVG
   ========================================================= */

const HEART = [

  "0110110",
  "1111111",
  "1111111",
  "0111110",
  "0011100",
  "0001000"

];


const DIAMOND = [

  "00100",
  "01110",
  "11111",
  "01110",
  "00100"

];


const COLORS = [

  "#eb4b4b",
  "#54d6c4",
  "#ffd966",
  "#ff9eb5",
  "#8fd3fe"

];


function pixelSVG(pattern,color,cell){

  const cols =
    pattern[0].length;

  let rects = "";

  pattern.forEach(
    (row,y)=>{

      [...row].forEach(
        (bit,x)=>{

          if(bit === "1"){

            rects +=
              `<rect
                x="${x*cell}"
                y="${y*cell}"
                width="${cell}"
                height="${cell}"
              />`;

          }

        }
      );

    }
  );

  const width =
    cols * cell;

  const height =
    pattern.length * cell;

  return `
    <svg
      viewBox="0 0 ${width} ${height}"
      width="${width}"
      height="${height}"
      fill="${color}"
      aria-hidden="true"
    >
      ${rects}
    </svg>
  `;

}


/* =========================================================
   CLICK SPARKLE BURST
   ========================================================= */

function createSparkles(target){

  const rect =
    target.getBoundingClientRect();

  const centerX =
    rect.left +
    rect.width / 2;

  const centerY =
    rect.top +
    rect.height / 2;


  const count =
    reduceMotion ? 2 : 10;


  for(let i=0;i<count;i++){

    const angle =
      Math.random() *
      Math.PI *
      2;

    const distance =
      40 +
      Math.random() *
      70;

    const dx =
      Math.cos(angle) *
      distance;

    const dy =
      Math.sin(angle) *
      distance;


    const isHeart =
      Math.random() < .6;


    const svg =
      pixelSVG(
        isHeart ? HEART : DIAMOND,
        randomItem(COLORS),
        2.5
      );


    const element =
      document.createElement("div");

    element.className =
      "pixel-burst";

    element.style.left =
      `${centerX}px`;

    element.style.top =
      `${centerY}px`;

    element.style.setProperty(
      "--dx",
      `${dx}px`
    );

    element.style.setProperty(
      "--dy",
      `${dy}px`
    );

    element.style.setProperty(
      "--rotate",
      `${-30 + Math.random()*60}deg`
    );

    element.innerHTML =
      svg;


    sparkleLayer.appendChild(
      element
    );


    element.addEventListener(
      "animationend",
      ()=>element.remove(),
      {once:true}
    );

  }

}


/* =========================================================
   XP PARTICLE
   ========================================================= */

function createXpParticle(target){

  const rect =
    target.getBoundingClientRect();

  const particle =
    document.createElement("span");

  particle.className =
    "xp-particle";

  particle.textContent =

  particle.style.left =

  particle.style.top =

  particle.style.setProperty(
    "--dx",
    `${(Math.random()-.5)*45}px`
  );

  particle.style.setProperty(
    "--dy",
    `${-55-Math.random()*25}px`
  );

  document.body.appendChild(
    particle
  );

  particle.addEventListener(
    "animationend",
    ()=>particle.remove(),
    {once:true}
  );

}


/* =========================================================
   PHOTO CARD
   ========================================================= */

function buildCard(photo,index){

  const card =
    document.createElement("article");

  card.className =
    "polaroid";

  card.tabIndex =
    0;

  card.setAttribute(
    "role",
    "button"
  );

  card.setAttribute(
    "aria-label",
    `${photo.alt}. Open photo`
  );


  const rotations = [
    -6,
    -4,
    -2,
     2,
     4,
     6
  ];


  card.style.setProperty(
    "--rotation",
    `${rotations[index % rotations.length]}deg`
  );


  /* Washi tape */

  const tape =
    WASHI[index % WASHI.length];


  const leftTape =
    document.createElement("div");

  leftTape.className =
    "washi left";

  leftTape.style.background =
    `repeating-linear-gradient(
      45deg,
      ${tape[0]} 0 6px,
      ${tape[1]} 6px 12px
    )`;


  const rightTape =
    document.createElement("div");

  rightTape.className =
    "washi right";

  rightTape.style.background =
    `repeating-linear-gradient(
      45deg,
      ${tape[0]} 0 6px,
      ${tape[1]} 6px 12px
    )`;


  /* Frame */

  const frame =
    document.createElement("div");

  frame.className =
    "photo-frame";


  const image =
    document.createElement("img");

  image.src =
    photo.src;

  image.alt =
    photo.alt;

  image.loading =
    "lazy";

  image.decoding =
    "async";


  /* Missing-image fallback */

  const placeholder =
    document.createElement("div");

  placeholder.className =
    "image-placeholder";

  placeholder.innerHTML = `
    <span style="font-size:1.8rem">📷</span>
    <strong>Memory Comming Soon 💔</strong>
    <small>${photo.src}</small>
  `;


  image.addEventListener(
    "error",
    ()=>{
      image.style.display =
        "none";

      placeholder.style.display =
        "flex";
    },
    {once:true}
  );


  frame.appendChild(
    image
  );

  frame.appendChild(
    placeholder
  );


  /* Sticker */

  const sticker =
    document.createElement("span");

  sticker.className =
    "sticker";

  sticker.textContent =
    STICKERS[
      index % STICKERS.length
    ];


  card.appendChild(
    leftTape
  );

  card.appendChild(
    rightTape
  );

  card.appendChild(
    frame
  );

  card.appendChild(
    sticker
  );


  /* Interaction */

  function activateCard(){

    card.classList.remove(
      "clicked"
    );

    /*
      Force a reflow so the pop animation
      works even when clicking the same photo
      repeatedly.
    */

    void card.offsetWidth;

    card.classList.add(
      "clicked"
    );

    createSparkles(card);
    createExtraSparkles(card);

    createXpParticle(card);

    openViewer(photo);

    showToast();

  }


  card.addEventListener(
    "click",
    activateCard
  );


  card.addEventListener(
    "keydown",
    event=>{

      if(
        event.key === "Enter" ||
        event.key === " "
      ){

        event.preventDefault();

        activateCard();

      }

    }
  );


  return card;
}


/* =========================================================
   PAGE CREATION
   ========================================================= */

function chunk(array,size){

  const result = [];

  for(
    let i=0;
    i<array.length;
    i+=size
  ){

    result.push(
      array.slice(i,i+size)
    );

  }

  return result;
}


function buildGallery(){

  track.innerHTML = "";

  const pageSize = getPageSize();

  const pages =
    chunk(
      PHOTOS,
      pageSize
    );


  pages.forEach(
    (photos,pageIndex)=>{

      const page =
        document.createElement("div");

      page.className =
        "page";

      page.setAttribute(
        "aria-label",
        `Memory page ${pageIndex+1}`
      );


      photos.forEach(
        (photo,photoIndex)=>{

          const absoluteIndex =
            pageIndex * pageSize +
            photoIndex;

          page.appendChild(
            buildCard(
              photo,
              absoluteIndex
            )
          );

        }
      );


      track.appendChild(
        page
      );

    }
  );


  pageTotal.textContent =
    `OF ${Math.max(1,pages.length)}`;


  updatePageUI();

}


/* =========================================================
   PAGE COUNT
   ========================================================= */

function totalPages(){

  const pageSize = getPageSize();

  return Math.max(
    1,
    Math.ceil(
      PHOTOS.length / pageSize
    )
  );

}


/* =========================================================
   PAGE-BASED XP BAR
   =========================================================

   Page 1:
     1 / total pages

   Page 2:
     2 / total pages

   Going forward -> bar increases.
   Going backward -> bar decreases.

   For the last page, the line reaches 100%.

   The displayed memory count reflects how many
   memories are represented up to the current page.
   ========================================================= */

function updateXpBar(){

  const pages =
    totalPages();

  const currentPageNumber =
    currentPage + 1;


  const progress =
    currentPageNumber /
    pages *
    100;


  xpFill.style.width =
    `${progress}%`;


  const pageSize = getPageSize();

  const displayedMemories =
    Math.min(
      currentPageNumber * pageSize,
      PHOTOS.length
    );


  xpValue.textContent =
    `${displayedMemories} / ${PHOTOS.length}`;


  xpProgressText.textContent =
    `page ${currentPageNumber} · ${Math.round(progress)}%`;


  xpBar.setAttribute(
    "aria-valuemax",
    String(PHOTOS.length)
  );

  xpBar.setAttribute(
    "aria-valuenow",
    String(displayedMemories)
  );

}


/* =========================================================
   PAGE NAVIGATION
   ========================================================= */

function goToPage(page){

  currentPage =
    clamp(
      page,
      0,
      totalPages()-1
    );


  track.style.transform =
    `translateX(-${currentPage*100}%)`;


  updatePageUI();

}


function updatePageUI(){

  const lastPage =
    totalPages()-1;


  prevBtn.disabled =
    currentPage === 0;

  nextBtn.disabled =
    currentPage === lastPage;


  pageNumber.textContent =
    `PAGE ${currentPage+1}`;


  updateXpBar();

}


prevBtn.addEventListener(
  "click",
  ()=>{
    goToPage(
      currentPage-1
    );
  }
);


nextBtn.addEventListener(
  "click",
  ()=>{
    goToPage(
      currentPage+1
    );
  }
);


/* =========================================================
   KEYBOARD NAVIGATION
   ========================================================= */

document.addEventListener(
  "keydown",
  event=>{

    if(
      viewer.classList.contains("open")
    ){

      return;

    }


    if(
      event.key === "ArrowLeft"
    ){

      goToPage(
        currentPage-1
      );

    }


    if(
      event.key === "ArrowRight"
    ){

      goToPage(
        currentPage+1
      );

    }

  }
);


/* =========================================================
   TOUCH SWIPE
   ========================================================= */

viewport.addEventListener(
  "touchstart",
  event=>{

    touchStartX =
      event.changedTouches[0].clientX;

  },
  {passive:true}
);


viewport.addEventListener(
  "touchend",
  event=>{

    if(
      touchStartX === null
    ){

      return;

    }


    const endX =
      event.changedTouches[0].clientX;


    const difference =
      endX - touchStartX;


    touchStartX =
      null;


    if(
      Math.abs(difference) < 50
    ){

      return;

    }


    if(
      difference < 0
    ){

      goToPage(
        currentPage+1
      );

    }else{

      goToPage(
        currentPage-1
      );

    }

  },
  {passive:true}
);


/* =========================================================
   FULLSCREEN VIEWER
   ========================================================= */

function openViewer(photo){

  viewerImage.style.display = "block";
  viewerVideo.style.display = "none";
  viewerVideo.pause();
  viewerVideo.removeAttribute("src");
  viewerVideo.load();

  viewerImage.src = photo.src;
  viewerImage.alt = photo.alt;
  viewerDate.textContent = photo.date;

  viewer.classList.add("open");
  viewer.setAttribute("aria-hidden","false");
  document.body.style.overflow = "hidden";
  viewerClose.focus();

}

function openVideoViewer(videoNumber){

  viewerImage.style.display = "none";
  viewerImage.removeAttribute("src");
  viewerVideo.style.display = "block";
  viewerVideo.src = `video/clip${videoNumber}.mp4`;
  viewerVideo.currentTime = 0;
  viewerDate.textContent = `Video Tape ${String(videoNumber).padStart(2,"0")}`;

  viewer.classList.add("open");
  viewer.setAttribute("aria-hidden","false");
  document.body.style.overflow = "hidden";
  viewerClose.focus();

}

function closeViewer(){

  viewerVideo.pause();
  viewerVideo.removeAttribute("src");
  viewerVideo.load();
  viewerImage.style.display = "block";

  viewer.classList.remove(
    "open"
  );

  viewer.setAttribute(
    "aria-hidden",
    "true"
  );


  document.body.style.overflow =
    "";

}


viewerClose.addEventListener(
  "click",
  closeViewer
);


viewer.addEventListener(
  "click",
  event=>{

    if(
      event.target === viewer
    ){

      closeViewer();

    }

  }
);


/* =========================================================
   ESC CLOSE
   ========================================================= */

document.addEventListener(
  "keydown",
  event=>{

    if(
      event.key === "Escape" &&
      viewer.classList.contains("open")
    ){

      closeViewer();

    }

  }
);


/* =========================================================
   TOAST
   ========================================================= */

function showToast(){

  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      ()=>{
        toast.classList.remove(
          "show"
        );
      },
      1800
    );

}


/* =========================================================
   VIDEO TAPES
   ========================================================= */

function chunkItems(array,size){
  const result = [];
  for(let i=0;i<array.length;i+=size){
    result.push(array.slice(i,i+size));
  }
  return result;
}

function totalVideoPages(){
  return Math.max(1, Math.ceil(VIDEO_COUNT / getPageSize()));
}

function buildVideoGallery(){

  videoTrack.innerHTML = "";
  const pageSize = getPageSize();
  const videos = Array.from({length:VIDEO_COUNT},(_,i)=>i+1);
  const pages = chunkItems(videos,pageSize);
  const rotations = [-3,2,-1,3,-2,1];

  pages.forEach((videoNumbers,pageIndex)=>{
    const page = document.createElement("div");
    page.className = "video-page";
    page.setAttribute("aria-label",`Video page ${pageIndex+1}`);

    videoNumbers.forEach(videoNumber=>{
      const card = document.createElement("article");
      card.className = "video-card";
      card.tabIndex = 0;
      card.setAttribute("role","button");
      card.setAttribute("aria-label",`Open Video Tape ${videoNumber}`);
      card.style.setProperty("--video-rotation",`${rotations[(videoNumber-1)%rotations.length]}deg`);

      const frame = document.createElement("div");
      frame.className = "video-frame";

      const video = document.createElement("video");
      video.src = `video/clip${videoNumber}.mp4`;
      video.preload = "metadata";
      video.muted = true;
      video.playsInline = true;
      video.setAttribute("aria-hidden","true");
      video.controls = false;

      const label = document.createElement("div");
      label.className = "video-label";
      label.textContent = `VIDEO TAPE ${String(videoNumber).padStart(2,"0")}`;

      frame.appendChild(video);
      card.appendChild(frame);
      card.appendChild(label);

      const activate = ()=>openVideoViewer(videoNumber);
      card.addEventListener("click",activate);
      card.addEventListener("keydown",event=>{
        if(event.key === "Enter" || event.key === " "){
          event.preventDefault();
          activate();
        }
      });

      page.appendChild(card);
    });

    videoTrack.appendChild(page);
  });

  videoPageTotal.textContent = `OF ${Math.max(1,pages.length)}`;
  updateVideoPageUI();
}

function goToVideoPage(page){
  currentVideoPage = clamp(page,0,totalVideoPages()-1);
  videoTrack.style.transform = `translateX(-${currentVideoPage*100}%)`;
  updateVideoPageUI();
}

function updateVideoPageUI(){
  const lastPage = totalVideoPages()-1;
  videoPrevBtn.disabled = currentVideoPage === 0;
  videoNextBtn.disabled = currentVideoPage === lastPage;
  videoPageNumber.textContent = `PAGE ${currentVideoPage+1}`;
}

videoPrevBtn.addEventListener("click",()=>goToVideoPage(currentVideoPage-1));
videoNextBtn.addEventListener("click",()=>goToVideoPage(currentVideoPage+1));

function showHome(){
  homeScreen.style.display = "grid";
  albumContent.classList.remove("active");
  videoScreen.classList.remove("active");
}

function showAlbum(){
  homeScreen.style.display = "none";
  videoScreen.classList.remove("active");
  albumContent.classList.add("active");
}

function showVideos(){
  homeScreen.style.display = "none";
  albumContent.classList.remove("active");
  videoScreen.classList.add("active");
}

albumChoice.addEventListener("click", showAlbum);
videoChoice.addEventListener("click", showVideos);
albumBack.addEventListener("click", showHome);
videoBack.addEventListener("click", showHome);


/* =========================================================
   RESPONSIVE PAGE SIZE
   ========================================================= */

let lastResponsivePageSize = getPageSize();

window.addEventListener("resize", ()=>{

  const newPageSize = getPageSize();

  if(newPageSize === lastResponsivePageSize){
    return;
  }

  const oldPageSize = lastResponsivePageSize;
  const firstVisiblePhoto = currentPage * oldPageSize;

  lastResponsivePageSize = newPageSize;

  currentPage =
    Math.floor(firstVisiblePhoto / newPageSize);

  const firstVisibleVideo = currentVideoPage * oldPageSize;
  currentVideoPage = Math.floor(firstVisibleVideo / newPageSize);

  buildGallery();
  buildVideoGallery();

});


/* =========================================================
   INITIALIZE
   ========================================================= */

function init(){

  createBackgroundDecorations();

  createSakura();

  createFloatingPixels();

  buildGallery();
  buildVideoGallery();

}


init();

</script>
